  oauth2_flows: [authorizationCode, clientCredentials, refreshToken]
  api_key_in: []
  notes: >-
    Autodesk Platform Services (APS) uses OAuth 2.0 exclusively. Two-legged (2LO,
    client_credentials) is used for app-level access; three-legged (3LO,
    authorization_code + PKCE) is used for user-context access. Secure Service
    Accounts (SSA) provide server-to-server access on behalf of a service identity.
schemes:
