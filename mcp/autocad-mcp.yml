notes: >-
  Autodesk publishes official, open-source reference Model Context Protocol (MCP)
  servers for Autodesk Platform Services (APS), plus an "Autodesk MCP Servers"
  program and marketplace publisher guide. The Node.js reference server is
  self-hosted (stdio transport) and uses Secure Service Accounts (SSA) for
  fine-grained access control to APS / ACC / BIM 360 data. There is no single
  Autodesk-hosted remote MCP endpoint; servers are self-deployed.
